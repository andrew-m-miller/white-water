name: build
run-name: Human test build — ${{ inputs.purpose }} [${{ inputs.lane }}] (${{ github.ref_name }})

on:
  # Intentionally manual-only. Local build and tests are the routine merge gate; this
  # workflow exists to produce platform artifacts when a human has a concrete test to
  # perform. The Flame box is airgapped, so this is the only way anything reaches it.
  workflow_dispatch:
    inputs:
      purpose:
        description: Human test that needs a fresh installable build
        required: true
        type: string
      lane:
        description: Build lane; p25-5 requires all explicit evaluator/runtime inputs below
        required: true
        type: choice
        default: standard
        options:
          - standard
          - p25-5
      p25_5_admission_file:
        description: Optional repository-relative SEA-RAFT-only candidate plan/template; admission is generated after export
        required: false
        type: string
      p25_5_legal_review_file:
        description: Repository-relative human legal-review attestation JSON (required for p25-5)
        required: false
        type: string
      p25_5_legal_review_sha256:
        description: SHA256 of the exact legal-review attestation JSON (required for p25-5)
        required: false
        type: string
      p25_5_conda_installer_url:
        description: SHA-pinned EL8 x86_64 Miniconda installer URL (required for p25-5)
        required: false
        type: string
      p25_5_conda_installer_sha256:
        description: SHA256 of the explicit Miniconda installer (required for p25-5)
        required: false
        type: string
      p25_5_conda_lock_file:
        description: Repository-relative SHA-pinned conda explicit package spec (required for p25-5)
        required: false
        type: string
      p25_5_conda_lock_sha256:
        description: SHA256 of the explicit conda environment lock/spec (required for p25-5)
        required: false
        type: string
      p25_5_qualifier:
        description: Actual Python evaluator entry point implementing verify --manifest --artifact --protocol --provider (required for p25-5)
        required: false
        type: string
        default: tools/bakeoff/evaluator.py
      p25_5_packager:
        description: Python evaluation-only packager entry point (required for p25-5)
        required: false
        type: string
        default: tools/p25_5/package.py
      p25_5_package_spec:
        description: Local package-spec template; admission and runtime use documented P25-5 placeholders (required for p25-5)
        required: false
        type: string
      p25_5_run_instructions:
        description: Local evaluation-only run instructions carried in and beside the archive (required for p25-5)
        required: false
        type: string

jobs:
  # Build on EL8, glibc 2.28 -- which is warp-drive's configuration, and is here because
  # departing from it produced a plugin Flame refused to load.
  #
  # The reasoning that failed: White Water targets "Rocky 9.5+", so an EL9 container looked
  # like the matching choice. It is not. Rocky 9.5's libgcc.a references `_dl_find_object`,
  # a glibc 2.35 symbol, and static libgcc drags that into anything it links -- while the
  # certified Flame box, also nominally Rocky 9.5, has an older glibc without it. Autodesk
  # certifies a point release and nobody runs `dnf update` on a Flame box, so "same distro
  # version" does not mean "same glibc". Measured 2026-08-20: the plugin was invisible to
  # Flame with `GLIBC_2.35 not found`.
  #
  # EL8 makes the whole class of problem go away rather than tracking it: a binary built
  # against 2.28 loads on every EL8 and EL9 host, whatever point release it sits at. The
  # cost is gcc-toolset, since EL8's default gcc is 8 -- and that also supplies its own
  # static libstdc++, so the CRB/libstdc++-static dance an EL9 build needs disappears too.
  linux:
    if: ${{ inputs.lane == 'standard' }}
    name: linux (EL8 / glibc 2.28)
    runs-on: ubuntu-latest
    container:
      image: almalinux:8
    steps:
      # git must exist before checkout, otherwise the action falls back to a tarball
      # download and silently skips submodules -- which here means no OpenFX headers and a
      # configure-time failure that looks like a broken checkout.
      - name: Install toolchain
        run: |
          dnf -y install git make cmake binutils tar gzip
          dnf -y install gcc-toolset-12
          echo "CC=/opt/rh/gcc-toolset-12/root/usr/bin/gcc" >> $GITHUB_ENV
          echo "CXX=/opt/rh/gcc-toolset-12/root/usr/bin/g++" >> $GITHUB_ENV

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # $CXX, not bare g++: gcc-toolset installs outside PATH by design, so the compiler
      # the build uses and the one a bare `g++` would find are different things -- and on
      # EL8 the latter does not exist at all.
      - name: Report toolchain
        run: |
          "$CXX" --version
          cmake --version
          ldd --version | head -1

      # ONNX Runtime for the Phase 0B probe. This must be the CUDA 12 build: the provider is
      # a separate .so with a different dependency closure, and the CPU isolation result is
      # explicitly not evidence that CUDA survives beside Flame's globally loaded CUDA,
      # cuDNN and cuBLAS copies.
      #
      # 1.29.0 is chosen because Flame 2026.2 carries 1.22.0 and the two MUST differ -- the
      # probe uses the reported version string to tell our copy from the host's, and matching
      # versions would make the entire measurement ambiguous.
      #
      # Verified 2026-08-20: this build's highest glibc requirement is 2.28, exactly the EL8
      # baseline, with no slack. That is checked below rather than assumed.
      - name: Fetch ONNX Runtime
        run: |
          dnf -y install curl
          ver=1.29.0
          curl -sSL -o ort.tgz \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ver}/onnxruntime-linux-x64-gpu_cuda12-${ver}.tgz"
          echo "4ca594a0da83927befbd73fe020d7f569be151d70bb4fe9741ad405f4882e2ad  ort.tgz" \
            | sha256sum -c -
          mkdir -p "$GITHUB_WORKSPACE/ort"
          tar xzf ort.tgz -C "$GITHUB_WORKSPACE/ort" --strip-components=1
          echo "WHITEWATER_ORT_ROOT=$GITHUB_WORKSPACE/ort" >> $GITHUB_ENV
          echo "ORT_VERSION=$ver" >> $GITHUB_ENV

      # The ONNX artifact is deliberately ignored by git. Reproduce it from the pinned
      # source commit and checkpoint, then let configure verify that its SHA256 is exactly
      # the one recorded in the manifest before it enters the bundle.
      - name: Export pinned SEA-RAFT M probe model
        run: |
          dnf -y install python3.11 python3.11-pip
          python3.11 -m venv "$RUNNER_TEMP/searaft-venv"
          py="$RUNNER_TEMP/searaft-venv/bin/python"
          "$py" -m pip install --upgrade pip
          "$py" -m pip install --index-url https://download.pytorch.org/whl/cpu \
            torch==2.2.0 torchvision==0.17.0
          grep -vE '^(torch|torchvision)==' models/requirements-searaft-export.txt \
            > "$RUNNER_TEMP/searaft-export-requirements.txt"
          "$py" -m pip install -r "$RUNNER_TEMP/searaft-export-requirements.txt"

          upstream="$RUNNER_TEMP/SEA-RAFT"
          checkpoint="$RUNNER_TEMP/sea-raft-m.safetensors"
          commit=$("$py" -c \
            'import json; print(json.load(open("models/sea-raft-m.json"))["upstream"]["commit"])')
          checkpoint_url=$("$py" -c \
            'import json; print(json.load(open("models/sea-raft-m.json"))["checkpoint"]["url"])')
          git init "$upstream"
          git -C "$upstream" remote add origin https://github.com/princeton-vl/SEA-RAFT.git
          git -C "$upstream" fetch --depth=1 origin "$commit"
          git -C "$upstream" checkout --detach FETCH_HEAD
          curl -sSL -o "$checkpoint" "$checkpoint_url"

          "$py" models/export_searaft.py \
            --upstream "$upstream" \
            --checkpoint "$checkpoint" \
            --output models/sea-raft-m-opset17.onnx \
            --update-manifest

          # The exporting user owns the file, so a content/hash check alone would not catch
          # the deterministic 0600 mode that Flame cannot read. Check the exact mode and
          # bytes before they enter the bundle.
          "$py" models/check_searaft_artifact.py \
            models/sea-raft-m.json models/sea-raft-m-opset17.onnx

      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DWHITEWATER_ORT_ROOT="$WHITEWATER_ORT_ROOT"

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error

      - name: Verify staged SEA-RAFT payload
        run: |
          python3.11 models/check_searaft_artifact.py \
            build/bundles/WhiteWaterOrtProbe.ofx.bundle/Contents/Resources/models/sea-raft-m.json \
            build/bundles/WhiteWaterOrtProbe.ofx.bundle/Contents/Resources/models/sea-raft-m-opset17.onnx

      # Diagnostics only -- the gate below does not read these. Recorded every run because
      # the glibc *release* and the highest symbol version a libc *defines* are different
      # numbers, and confusing them is what produced a plugin Flame would not load. Seeing
      # both in the log is what makes that distinction concrete next time.
      - name: Report glibc facts
        run: |
          echo "container glibc release:"
          ldd --version | head -1 | sed 's/^/  /'
          echo "highest symbol version defined by the container's libc:"
          objdump -T /lib64/libc.so.6 | grep -o 'GLIBC_[0-9][0-9.]*' | sed 's/GLIBC_//' \
            | sort -uV | tail -1 | sed 's/^/  /'

      # The gate that matters most. A plugin needing a newer glibc than the host provides is
      # invisible with no error anywhere, so this is the difference between an artifact and
      # a thing that merely compiled.
      #
      # The baseline is HARD-CODED and must stay that way. An earlier revision derived it
      # from the build container's own libc, on the reasoning that this asserts the true
      # statement "needs nothing the platform we built against lacks". That statement is
      # true, useless, and was already noted here as "nearly tautological" -- it compares
      # the build machine against itself and therefore cannot fail for the one reason the
      # gate exists. It duly passed a build that Flame then refused to load.
      #
      # 2.28 is EL8's glibc, which every EL8 and EL9 host provides regardless of point
      # release. If this number is ever raised, it must be raised to something measured on
      # a target machine, never to something read off the builder.
      - name: Check glibc baseline
        run: |
          for binary in build/bundles/*.ofx.bundle/Contents/Linux-*/*.ofx; do
            scripts/check-glibc-baseline.sh "$binary" 2.28
          done

      # Assert the version script actually worked, rather than trusting that it was passed.
      #
      # This is White Water's own gate, not one warp-drive has. From Phase 3 the plugin
      # links ONNX Runtime, which carries protobuf, abseil and a CUDA runtime -- all things
      # Flame may already have loaded at other versions. Two visible copies of protobuf in
      # one process is a crash with no useful backtrace. cmake/ofx.map is what prevents it,
      # and a linker flag that silently stopped being applied would not otherwise be
      # noticed until a host crashed.
      - name: Verify exported symbols
        run: |
          fail=0
          for binary in build/bundles/*.ofx.bundle/Contents/Linux-*/*.ofx; do
            echo "== $binary"
            exported=$(nm -D --defined-only --extern-only "$binary" | awk '{print $NF}' | sort)
            echo "$exported" | sed 's/^/   /'
            for required in OfxGetNumberOfPlugins OfxGetPlugin OfxSetHost; do
              echo "$exported" | grep -qx "$required" || {
                echo "   MISSING entry point: $required" >&2; fail=1; }
            done
            unexpected=$(echo "$exported" | grep -vx -e OfxGetNumberOfPlugins \
                                                    -e OfxGetPlugin -e OfxSetHost || true)
            if [ -n "$unexpected" ]; then
              echo "   UNEXPECTED exported symbols (version script not applied?):" >&2
              echo "$unexpected" | sed 's/^/     /' >&2
              fail=1
            fi
          done
          exit $fail

      # The ORT probe's entire validity rests on NOT linking ONNX Runtime. A DT_NEEDED entry
      # is resolved by the loader through the global scope, which would bind the probe to
      # Flame's already-loaded copy before any of its code runs -- and it would still produce
      # a confident-looking report, measuring nothing. This is cheap to check and impossible
      # to notice by reading the output.
      - name: Verify the ORT probe does not link ONNX Runtime
        run: |
          probe=build/bundles/WhiteWaterOrtProbe.ofx.bundle/Contents/Linux-x86-64/WhiteWaterOrtProbe.ofx
          test -f "$probe" || { echo "ORT probe was not built" >&2; exit 1; }
          echo "== DT_NEEDED of $probe"
          objdump -p "$probe" | grep NEEDED | sed 's/^/   /'
          if objdump -p "$probe" | grep NEEDED | grep -qi onnxruntime; then
            echo "FAIL: the probe links ONNX Runtime; it must only dlopen it." >&2
            exit 1
          fi
          echo "OK: reached only through dlopen."

      # ONNX Runtime is a third-party binary we redistribute inside the bundle, so it gets
      # the same baseline check our own code does -- if it needs a newer glibc than the
      # target, the bundle is as unloadable as a wrong-glibc plugin would be.
      - name: Check ONNX Runtime glibc baseline
        run: |
          for lib in build/bundles/WhiteWaterOrtProbe.ofx.bundle/Contents/Libraries/*.so*; do
            [ -f "$lib" ] || continue
            scripts/check-glibc-baseline.sh "$lib" 2.28
          done

      # The GitHub runner has no NVIDIA userspace stack, so CUDA/cuDNN/cuBLAS entries are
      # expected to be unresolved here. Preserve the complete report in the test archive;
      # rerunning the included script on the Flame box records the actual selected closure.
      - name: Report ORT CUDA dependency closure
        run: |
          set +e
          scripts/report-ort-closure.sh \
            build/bundles/WhiteWaterOrtProbe.ofx.bundle/Contents/Libraries \
            > ort-cuda-closure-build-host.txt 2>&1
          status=$?
          set -e
          cat ort-cuda-closure-build-host.txt
          echo "closure reporter exit status: $status (unresolved GPU libraries are expected here)"

      # A plugin in the wrong architecture directory is invisible, with no error message
      # anywhere -- the same class of failure as the glibc one, and just as silent.
      - name: Verify bundle layout
        run: |
          fail=0
          for bundle in build/bundles/*.ofx.bundle; do
            name=$(basename "$bundle" .ofx.bundle)
            test -f "$bundle/Contents/Linux-x86-64/$name.ofx" || {
              echo "missing or misplaced binary for $name:" >&2
              find "$bundle" -type f | sed 's/^/  /' >&2
              fail=1; }
          done
          exit $fail

      # Nothing is bundled into Contents/Libraries yet, so every dependency must be a
      # genuine host system library. Once ONNX Runtime arrives this step becomes the check
      # that its libraries were actually shipped -- the failure warp-drive hit, where a
      # dropped ICU passed CI (masked by LD_LIBRARY_PATH) and then failed on the host with
      # status 127. Clearing LD_LIBRARY_PATH is what makes ldd honour only the image's own
      # $ORIGIN rpath, which is what the host will do.
      - name: Report runtime dependencies
        run: |
          for binary in build/bundles/*.ofx.bundle/Contents/Linux-*/*.ofx; do
            echo "== $binary"
            env -u LD_LIBRARY_PATH ldd "$binary" | sed 's/^/   /'
          done

      - name: Package
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-8)
          staging="whitewater-linux-$SHA_SHORT"
          mkdir -p "$staging"
          cp -R build/bundles/*.ofx.bundle "$staging/"
          cp docs/host-notes.md "$staging/"
          cp scripts/report-ort-closure.sh "$staging/"
          cp ort-cuda-closure-build-host.txt "$staging/"
          cat > "$staging/INSTALL.txt" <<'EOF'
          White Water -- Linux OFX bundles
          ================================

          Built on EL8 against a glibc 2.28 baseline, so these load on any EL8 or EL9
          host regardless of point release.

          Verify the download first, from the directory holding the tarball:

              sha256sum -c whitewater-linux-*.tar.gz.sha256

          Install, as root:

              cp -R *.ofx.bundle /usr/OFX/Plugins/

          Or, without root, point the host at the bundles before launching it. Flame
          boxes are conventionally tcsh, so the syntax is probably the first of these --
          check with "echo $SHELL" if the first one errors:

              setenv OFX_PLUGIN_PATH /path/to/this/directory     # tcsh / csh
              export OFX_PLUGIN_PATH=/path/to/this/directory     # bash / zsh

          Then restart Flame.

          Two diagnostic plugins, neither of them the product. Both pass frames through
          untouched.

          WhiteWaterHostProbe writes a report on what this host actually supports.
          Apply it in a GENERAL-context Batch node, view it so it renders, then press
          "Run Probe" and exercise the viewer with the pen.

          WhiteWaterOrtProbe contains the pinned SEA-RAFT M model and CUDA 12 execution
          provider for the Phase 0B measurement. Apply it and press "Run ORT Probe". It
          checks runtime isolation, CPU and CUDA identity/direction, mapped provider/CUDA
          libraries, VRAM checkpoints, warm/steady 480x640 timing, repeated session lifecycle,
          cross-thread cancellation, and provider-init failure with CPU fallback. Extended
          measurements are enabled in Flame by default and can take time; they include a
          controlled CUDA arena-limit test using a 64 MiB gpu_mem_limit at 480x640, followed
          by numerical recovery in a fresh CPU session. The limit is not a device-wide CUDA
          allocation fence, and the CPU check is not an automatic production fallback. Set
          WHITEWATER_ORT_PROBE_SIZES before launching Flame to select other bounded HxW sizes.
          Set WHITEWATER_ORT_REQUIRE_GPU_MEM_LIMIT=1 to make a missing or failed arena-limit
          result fail the probe action while qualifying 0B.

          For the remaining higher-resolution 0B qualification, run exactly one target after
          each fresh Flame restart. In tcsh, before launching Flame:

              setenv WHITEWATER_ORT_HIGHRES_GPU_ONLY 1
              setenv WHITEWATER_ORT_HIGHRES_SIZE 2160x3840
              setenv WHITEWATER_ORT_GPU_MEM_LIMIT_MIB 16384
              setenv WHITEWATER_ORT_REQUIRE_HIGHRES_RESULT 1
              setenv WHITEWATER_ORT_PROBE_LOG /var/tmp/whitewater-ortprobe-uhd.txt

          The accepted source HxW values are 2160x3840 (UHD), 2160x4096 (DCI 4K), and
          3164x4608 (Alexa 35 open gate). Change the size and log basename, restart Flame,
          and repeat. The Alexa input is replication-padded to a 3168x4608 network tensor.
          No matching Flame source and no duplicated probe node are needed: this path uses
          synthetic tensors, runs CUDA only at the requested high resolution, and skips the
          ordinary extended CPU/CUDA measurements. It uses one fresh CUDA session with a
          16 GiB ORT arena cap and reports one warm run, three steady runs, sampled device-wide
          NVML use, session-cleanup use, and whether inference passed or met a bounded
          allocation stop. A BFCArena diagnostic does not prove whether the configured arena
          ceiling or physical device memory was the ultimate constraint.
          That cap and the accepted target list belong only to this diagnostic artifact; they
          are not product resolution limits. gpu_mem_limit is not a device-wide allocation
          fence. The required measurement-result gate passes for either an inference result or
          a classified bounded-allocation stop; read HIGHRES QUALIFICATION VERDICT separately.

          For the ordinary lifecycle measurement (not high-resolution mode), duplicate the node
          and run the probe on each copy; instance handles and process-live counts in the reports
          make that manual lifecycle check observable. Its report goes to
          $WHITEWATER_ORT_PROBE_LOG, else
          $TMPDIR/whitewater-ortprobe.txt, else /tmp. Read the VERDICT block at the end;
          the reported version must NOT match Flame's own ONNX Runtime, or the result is
          ambiguous rather than positive.

          From this unpacked directory, record the target box's dependency closure too:

              ./report-ort-closure.sh WhiteWaterOrtProbe.ofx.bundle/Contents/Libraries \
                  > ort-cuda-closure-flame.txt

          The report is written to $WHITEWATER_PROBE_LOG, else $TMPDIR/whitewater-hostprobe.txt,
          else /tmp/whitewater-hostprobe.txt -- and also to stderr, which Flame captures
          under /opt/Autodesk/log/.

          See host-notes.md for the full procedure and for the five open questions this
          probe exists to answer. Please send back the report file.
          EOF
          tar -czf "$staging.tar.gz" "$staging"
          # Validate the extracted tarball too: this checks the final package payload rather
          # than only the pre-archive staging directory.
          package_check="$RUNNER_TEMP/whitewater-package-check"
          mkdir -p "$package_check"
          (umask 022; tar -xzf "$staging.tar.gz" -C "$package_check")
          python3.11 models/check_searaft_artifact.py \
            "$package_check/$staging/WhiteWaterOrtProbe.ofx.bundle/Contents/Resources/models/sea-raft-m.json" \
            "$package_check/$staging/WhiteWaterOrtProbe.ofx.bundle/Contents/Resources/models/sea-raft-m-opset17.onnx"
          sha256sum "$staging.tar.gz" > "$staging.tar.gz.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: whitewater-linux-el8
          path: |
            whitewater-linux-*.tar.gz
            whitewater-linux-*.tar.gz.sha256
          if-no-files-found: error

  macos:
    if: ${{ inputs.lane == 'standard' }}
    name: macos (arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(sysctl -n hw.ncpu)

      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error

      - name: Verify plugin architecture (arm64-only)
        run: |
          for binary in build/bundles/*.ofx.bundle/Contents/MacOS/*.ofx; do
            archs=$(lipo -archs "$binary")
            echo "$binary: $archs"
            [ "$archs" = "arm64" ] || {
              echo "expected arm64-only, got '$archs': $binary" >&2; exit 1; }
          done

      # The macOS half of the symbol gate. See the Linux job for why this matters here more
      # than it does in warp-drive. There is no version script on macOS -- the hidden
      # visibility preset plus the explicit default visibility on the entry points is what
      # produces this, so it is a different mechanism reaching the same result and is worth
      # asserting separately rather than assuming it follows from the Linux check passing.
      - name: Verify exported symbols
        run: |
          fail=0
          for binary in build/bundles/*.ofx.bundle/Contents/MacOS/*.ofx; do
            echo "== $binary"
            exported=$(nm -gU "$binary" | awk '{print $NF}' | sed 's/^_//' | sort)
            echo "$exported" | sed 's/^/   /'
            for required in OfxGetNumberOfPlugins OfxGetPlugin OfxSetHost; do
              echo "$exported" | grep -qx "$required" || {
                echo "   MISSING entry point: $required" >&2; fail=1; }
            done
            unexpected=$(echo "$exported" | grep -vx -e OfxGetNumberOfPlugins \
                                                    -e OfxGetPlugin -e OfxSetHost || true)
            if [ -n "$unexpected" ]; then
              echo "   UNEXPECTED exported symbols:" >&2
              echo "$unexpected" | sed 's/^/     /' >&2
              fail=1
            fi
          done
          exit $fail

      - name: Verify bundle layout
        run: |
          fail=0
          for bundle in build/bundles/*.ofx.bundle; do
            name=$(basename "$bundle" .ofx.bundle)
            test -f "$bundle/Contents/MacOS/$name.ofx" || {
              echo "missing or misplaced binary for $name" >&2; fail=1; }
            test -f "$bundle/Contents/Info.plist" || {
              echo "missing Info.plist for $name" >&2; fail=1; }
          done
          exit $fail

      - name: Package
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-8)
          staging="whitewater-macos-$SHA_SHORT"
          mkdir -p "$staging"
          cp -R build/bundles/*.ofx.bundle "$staging/"
          cp docs/host-notes.md "$staging/"
          cat > "$staging/INSTALL.txt" <<'EOF'
          White Water -- macOS OFX bundles (arm64, Apple Silicon)
          =======================================================

          These are not signed or notarized. A bundle downloaded through a browser carries
          a quarantine attribute that stops the host loading it, so strip it after copying:

              xattr -dr com.apple.quarantine *.ofx.bundle

          Verify the download first:

              shasum -a 256 -c whitewater-macos-*.tar.gz.sha256

          Install:

              sudo cp -R *.ofx.bundle /Library/OFX/Plugins/

          Or point the host at this directory instead:

              export OFX_PLUGIN_PATH=/path/to/this/directory

          WhiteWaterHostProbe is a diagnostic plugin, not the product. See host-notes.md
          for the procedure and for the five open questions it exists to answer.
          EOF
          tar -czf "$staging.tar.gz" "$staging"
          shasum -a 256 "$staging.tar.gz" > "$staging.tar.gz.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: whitewater-macos
          path: |
            whitewater-macos-*.tar.gz
            whitewater-macos-*.tar.gz.sha256
          if-no-files-found: error

  # P25-5 is an explicitly selected lane. It is deliberately separate from the ordinary
  # human-test artifacts above: this job carries an evaluation-only conda-pack runtime and
  # refuses to pretend that P25-4's callback-based session library is a runnable evaluator.
  # The lane remains manual-only because the target measurement machine is airgapped and the
  # conda/evaluator/package inputs are supplied by the operator for that concrete test. The
  # technical admission itself is generated from the freshly exported SEA-RAFT artifact below.
  p25_5:
    if: ${{ inputs.lane == 'p25-5' }}
    name: p25-5 qualification (EL8 / glibc 2.28)
    runs-on: ubuntu-latest
    container:
      image: almalinux:8
    env:
      P25_5_ADMISSION_PLAN: ${{ inputs.p25_5_admission_file }}
      P25_5_LEGAL_REVIEW_FILE: ${{ inputs.p25_5_legal_review_file }}
      P25_5_LEGAL_REVIEW_SHA256: ${{ inputs.p25_5_legal_review_sha256 }}
      P25_5_CONDA_INSTALLER_URL: ${{ inputs.p25_5_conda_installer_url }}
      P25_5_CONDA_INSTALLER_SHA256: ${{ inputs.p25_5_conda_installer_sha256 }}
      P25_5_CONDA_LOCK_FILE: ${{ inputs.p25_5_conda_lock_file }}
      P25_5_CONDA_LOCK_SHA256: ${{ inputs.p25_5_conda_lock_sha256 }}
      P25_5_QUALIFIER: ${{ inputs.p25_5_qualifier }}
      P25_5_PACKAGER: ${{ inputs.p25_5_packager }}
      P25_5_PACKAGE_SPEC: ${{ inputs.p25_5_package_spec }}
      P25_5_RUN_INSTRUCTIONS: ${{ inputs.p25_5_run_instructions }}
      P25_5_OUTPUT_DIR: p25-5-output
    steps:
      - name: Install EL8 build and runtime prerequisites
        run: |
          dnf -y install git make cmake binutils tar gzip curl bzip2 xz file findutils
          dnf -y install gcc-toolset-12 python3.11 python3.11-pip
          echo "CC=/opt/rh/gcc-toolset-12/root/usr/bin/gcc" >> "$GITHUB_ENV"
          echo "CXX=/opt/rh/gcc-toolset-12/root/usr/bin/g++" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Fail closed on missing P25-5 inputs
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64 || {
            echo "P25-5 runtime must be built on EL8 x86_64 (got $(uname -m))" >&2; exit 1; }
          for name in \
            P25_5_CONDA_INSTALLER_URL \
            P25_5_CONDA_INSTALLER_SHA256 \
            P25_5_CONDA_LOCK_FILE \
            P25_5_CONDA_LOCK_SHA256 \
            P25_5_LEGAL_REVIEW_FILE \
            P25_5_LEGAL_REVIEW_SHA256 \
            P25_5_QUALIFIER \
            P25_5_PACKAGER \
            P25_5_PACKAGE_SPEC \
            P25_5_RUN_INSTRUCTIONS; do
            test -n "${!name:-}" || {
              if [ "$name" = P25_5_QUALIFIER ]; then
                echo "P25-5 evaluator entry point is not supplied: P25-4 session.py is callback-only and cannot be packaged as a runnable evaluator" >&2
              else
                echo "P25-5 requires explicit $name; no evaluator/runtime may be invented" >&2
              fi
              exit 1; }
          done
          [[ "$P25_5_CONDA_INSTALLER_URL" =~ ^https?:// ]] || {
            echo "P25-5 conda installer URL must be explicit HTTPS/HTTP" >&2; exit 1; }
          lock_file="$GITHUB_WORKSPACE/$P25_5_CONDA_LOCK_FILE"
          case "$P25_5_CONDA_LOCK_FILE" in
            /*|*..*|*//*|"")
              echo "P25-5 conda lock file must be a repository-relative path without traversal" >&2
              exit 1 ;;
          esac
          test -f "$lock_file" || {
            echo "P25-5 explicit conda lock/spec is missing: $P25_5_CONDA_LOCK_FILE" >&2; exit 1; }
          test ! -L "$lock_file" || {
            echo "P25-5 conda lock/spec must not be a symlink" >&2; exit 1; }
          [[ "$P25_5_CONDA_INSTALLER_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
            echo "P25-5 conda installer SHA256 must be lowercase 64-hex" >&2; exit 1; }
          [[ "$P25_5_CONDA_LOCK_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
            echo "P25-5 conda lock/spec SHA256 must be lowercase 64-hex" >&2; exit 1; }
          [[ "$P25_5_LEGAL_REVIEW_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
            echo "P25-5 legal-review SHA256 must be lowercase 64-hex" >&2; exit 1; }

          case "$P25_5_LEGAL_REVIEW_FILE" in
            /*|*..*|*//*|"")
              echo "P25-5 legal-review file must be a repository-relative path without traversal" >&2
              exit 1 ;;
          esac
          legal_review_file="$GITHUB_WORKSPACE/$P25_5_LEGAL_REVIEW_FILE"
          test -f "$legal_review_file" || {
            echo "P25-5 legal-review file is missing: $P25_5_LEGAL_REVIEW_FILE" >&2; exit 1; }
          test ! -L "$legal_review_file" || {
            echo "P25-5 legal-review file must not be a symlink" >&2; exit 1; }
          test "$(stat -c '%a' "$legal_review_file")" = 644 || {
            echo "P25-5 legal-review file must have mode 0644: $P25_5_LEGAL_REVIEW_FILE" >&2; exit 1; }
          actual_legal_review_sha=$(sha256sum -- "$legal_review_file" | awk '{print $1}')
          test "$actual_legal_review_sha" = "$P25_5_LEGAL_REVIEW_SHA256" || {
            echo "P25-5 legal-review SHA256 mismatch: expected $P25_5_LEGAL_REVIEW_SHA256, got $actual_legal_review_sha" >&2
            exit 1; }
          python3.11 tools/p25_5/legal_review.py \
            --protocol bakeoff/protocol-v2.json \
            --manifest sea-raft-m models/sea-raft-m.json \
            --review "$legal_review_file" \
            --sha256 "$P25_5_LEGAL_REVIEW_SHA256"

          if [ -n "${P25_5_ADMISSION_PLAN:-}" ]; then
            case "$P25_5_ADMISSION_PLAN" in
              /*|*..*|*//*|"")
                echo "P25-5 candidate plan must be a repository-relative path without traversal" >&2
                exit 1 ;;
            esac
            plan_file="$GITHUB_WORKSPACE/$P25_5_ADMISSION_PLAN"
            test -f "$plan_file" || {
              echo "P25-5 candidate plan is missing: $P25_5_ADMISSION_PLAN" >&2; exit 1; }
            test ! -L "$plan_file" || {
              echo "P25-5 candidate plan must not be a symlink" >&2; exit 1; }
            python3.11 - "$plan_file" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          try:
              document = json.loads(path.read_text(encoding="utf-8"))
          except (OSError, UnicodeError, ValueError) as exc:
              raise SystemExit(f"P25-5 candidate plan is not valid JSON: {exc}")
          if not isinstance(document, dict):
              raise SystemExit("P25-5 candidate plan must be a JSON object")
          raw = document.get("candidate_ids")
          if raw is None:
              raw = document.get("candidates")
              if isinstance(raw, list):
                  ids = []
                  for index, item in enumerate(raw):
                      if not isinstance(item, dict) or not isinstance(item.get("candidate_id"), str):
                          raise SystemExit(
                              f"P25-5 candidate plan candidates[{index}] must contain candidate_id"
                          )
                      ids.append(item["candidate_id"])
              else:
                  ids = None
          else:
              ids = raw
          if not isinstance(ids, list) or not all(isinstance(item, str) and item for item in ids):
              raise SystemExit(
                  "P25-5 candidate plan must contain candidate_ids or candidates[].candidate_id"
              )
          if len(ids) != len(set(ids)) or sorted(set(ids)) != ["sea-raft-m"]:
              raise SystemExit(
                  "P25-5 currently admits only sea-raft-m; RAFT/NeuFlow/WAFT are not silently admitted"
              )
          print("P25-5 candidate plan: SEA-RAFT M only")
          PY
          fi

      - name: Report EL8 toolchain
        run: |
          "$CXX" --version
          cmake --version
          ldd --version | head -1

      # The ONNX payload is ignored by git. Reproduce the exact pinned SEA-RAFT M export before
      # admission; the generated Linux row carries the current artifact/environment hashes and
      # is the only candidate this lane may package automatically.
      - name: Export pinned SEA-RAFT M measurement artifact
        run: |
          set -euo pipefail
          dnf -y install python3.11 python3.11-pip
          python3.11 -m venv "$RUNNER_TEMP/searaft-export-venv"
          py="$RUNNER_TEMP/searaft-export-venv/bin/python"
          "$py" -m pip install --upgrade pip
          "$py" -m pip install --index-url https://download.pytorch.org/whl/cpu \
            torch==2.2.0 torchvision==0.17.0
          grep -vE '^(torch|torchvision)==' models/requirements-searaft-export.txt \
            > "$RUNNER_TEMP/searaft-export-requirements.txt"
          "$py" -m pip install -r "$RUNNER_TEMP/searaft-export-requirements.txt"

          upstream="$RUNNER_TEMP/SEA-RAFT"
          checkpoint="$RUNNER_TEMP/sea-raft-m.safetensors"
          commit=$("$py" -c \
            'import json; print(json.load(open("models/sea-raft-m.json"))["upstream"]["commit"])')
          checkpoint_url=$("$py" -c \
            'import json; print(json.load(open("models/sea-raft-m.json"))["checkpoint"]["url"])')
          git init "$upstream"
          git -C "$upstream" remote add origin https://github.com/princeton-vl/SEA-RAFT.git
          git -C "$upstream" fetch --depth=1 origin "$commit"
          git -C "$upstream" checkout --detach FETCH_HEAD
          curl --fail --location --retry 3 --retry-all-errors -o "$checkpoint" "$checkpoint_url"

          "$py" models/export_searaft.py \
            --upstream "$upstream" \
            --checkpoint "$checkpoint" \
            --output models/sea-raft-m-opset17.onnx \
            --platform linux-x86_64 \
            --update-manifest
          "$py" models/check_searaft_artifact.py \
            models/sea-raft-m.json models/sea-raft-m-opset17.onnx

      - name: Generate SEA-RAFT CPU measurement admission
        run: |
          set -euo pipefail
          mkdir -p "$P25_5_OUTPUT_DIR"
          python3.11 tools/p25_5/admission.py \
            --protocol bakeoff/protocol-v2.json \
            --candidate models/sea-raft-m.json models/sea-raft-m-opset17.onnx linux-x86_64 \
            --provider cpu \
            --legal-review-file "$P25_5_LEGAL_REVIEW_FILE" \
            --legal-review-sha256 "$P25_5_LEGAL_REVIEW_SHA256" \
            --output "$P25_5_OUTPUT_DIR/sea-raft-admission.json"
          candidate_ids=$(python3.11 - "$P25_5_OUTPUT_DIR/sea-raft-admission.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          document = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(" ".join(entry.get("candidate_id", "") for entry in document.get("candidates", [])))
          PY
          )
          if [ "$candidate_ids" != "sea-raft-m" ]; then
            echo "P25-5 clean-checkout lane may admit only sea-raft-m (got: $candidate_ids)" >&2
            exit 1
          fi
          echo "generated SEA-RAFT admission: $P25_5_OUTPUT_DIR/sea-raft-admission.json"
          echo "P25_5_ADMISSION_FILE=$P25_5_OUTPUT_DIR/sea-raft-admission.json" >> "$GITHUB_ENV"

      # Keep the ordinary repository suite in the P25-5 lane. This is independent of the
      # evaluator runtime and catches regressions in the host-free flow algebra and OFX bundle.
      - name: Configure ordinary gates
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build ordinary gates
        run: cmake --build build -j$(nproc)

      - name: Test ordinary gates
        run: ctest --test-dir build --output-on-failure --no-tests=error

      # These are the candidate/export contract gates, kept visible in the workflow even though
      # CTest also registers most of them. They validate provenance, schema, hash/mode, tensor,
      # direction and operator rules without treating any candidate as a shipping choice.
      - name: Run candidate export and contract gates
        run: |
          python3.11 models/check_searaft_manifest.py models/sea-raft-m.json
          python3.11 models/check_raft_manifest.py models/raft-original.json
          python3.11 models/check_neuflow_manifest.py models/neuflow-v2.json
          python3.11 models/check_waft_manifest.py
          python3.11 models/p25_3_candidate_manifest_tests.py
          python3.11 models/artifact_tests.py
          python3.11 models/artifact_import_tests.py
          python3.11 models/neuflow_export_tests.py
          python3.11 models/raft_export_tests.py
          python3.11 models/waft_export_tests.py

      - name: Fetch explicit conda bootstrap and environment lock
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p25-5-inputs"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "$RUNNER_TEMP/p25-5-inputs/miniconda.sh" "$P25_5_CONDA_INSTALLER_URL"
          printf '%s  %s\n' "$P25_5_CONDA_INSTALLER_SHA256" \
            "$RUNNER_TEMP/p25-5-inputs/miniconda.sh" | sha256sum --check --status
          lock_file="$GITHUB_WORKSPACE/$P25_5_CONDA_LOCK_FILE"
          cp -- "$lock_file" "$RUNNER_TEMP/p25-5-inputs/environment.lock"
          printf '%s  %s\n' "$P25_5_CONDA_LOCK_SHA256" \
            "$RUNNER_TEMP/p25-5-inputs/environment.lock" | sha256sum --check --status
          bash "$RUNNER_TEMP/p25-5-inputs/miniconda.sh" -b -p "$RUNNER_TEMP/miniconda"
          # shellcheck disable=SC1091
          source "$RUNNER_TEMP/miniconda/etc/profile.d/conda.sh"
          conda config --system --set always_yes true
          conda --version
          # This is an explicit conda package spec (the format consumed by `conda create
          # --file`), not an environment YAML. It is hash-bound before the solver runs.
          conda create --prefix "$RUNNER_TEMP/p25-5-conda-env" \
            --file "$RUNNER_TEMP/p25-5-inputs/environment.lock"
          test -x "$RUNNER_TEMP/p25-5-conda-env/bin/python"
          test -x "$RUNNER_TEMP/p25-5-conda-env/bin/conda-pack" || {
            echo "the locked evaluator environment must carry conda-pack" >&2; exit 1; }
          "$RUNNER_TEMP/p25-5-conda-env/bin/conda-pack" --version
          "$RUNNER_TEMP/p25-5-conda-env/bin/python" - <<'PY'
          import importlib.metadata
          import onnxruntime
          import sys

          if sys.version_info[:2] != (3, 11):
              raise SystemExit(f"expected pinned Python 3.11, got {sys.version}")
          if onnxruntime.__version__ != "1.29.0":
              raise SystemExit(f"expected onnxruntime-gpu 1.29.0, got {onnxruntime.__version__}")
          try:
              distribution = importlib.metadata.distribution("onnxruntime-gpu")
          except importlib.metadata.PackageNotFoundError as exc:
              raise SystemExit("the runtime must contain onnxruntime-gpu, not only onnxruntime") from exc
          if distribution.version != "1.29.0":
              raise SystemExit(f"expected onnxruntime-gpu 1.29.0, got {distribution.version}")
          if "CUDAExecutionProvider" not in onnxruntime.get_available_providers():
              raise SystemExit("onnxruntime-gpu does not advertise CUDAExecutionProvider")
          print("runtime Python/onnxruntime-gpu/CPU+CUDA provider identity: PASS")
          PY

      - name: Pack and relocate the qualified conda runtime
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p25-5-runtime-extracted" "$P25_5_OUTPUT_DIR"
          runtime_archive="$RUNNER_TEMP/whitewater-p25-5-runtime.tar.gz"
          "$RUNNER_TEMP/p25-5-conda-env/bin/conda-pack" \
            --prefix "$RUNNER_TEMP/p25-5-conda-env" \
            --format tar.gz \
            --output "$runtime_archive"
          runtime_sha=$(sha256sum -- "$runtime_archive" | awk '{print $1}')
          printf '%s  %s\n' "$runtime_sha" "$(basename "$runtime_archive")" \
            > "$P25_5_OUTPUT_DIR/whitewater-p25-5-runtime.tar.gz.sha256"
          "$RUNNER_TEMP/miniconda/bin/conda" list --prefix "$RUNNER_TEMP/p25-5-conda-env" --explicit \
            > "$P25_5_OUTPUT_DIR/whitewater-p25-5-runtime.inventory"
          "$RUNNER_TEMP/miniconda/bin/conda" list --prefix "$RUNNER_TEMP/p25-5-conda-env" --json \
            > "$P25_5_OUTPUT_DIR/whitewater-p25-5-runtime.inventory.json"
          tar --extract --gzip --file "$runtime_archive" \
            --directory "$RUNNER_TEMP/p25-5-runtime-extracted"
          test -x "$RUNNER_TEMP/p25-5-runtime-extracted/bin/conda-unpack"
          "$RUNNER_TEMP/p25-5-runtime-extracted/bin/conda-unpack"
          test -x "$RUNNER_TEMP/p25-5-runtime-extracted/bin/python"
          # The packed environment is the exact carried runtime; this smoke import catches a
          # broken relocation before the evaluator is allowed to run.
          "$RUNNER_TEMP/p25-5-runtime-extracted/bin/python" - <<'PY'
          import onnxruntime
          if onnxruntime.__version__ != "1.29.0":
              raise SystemExit("relocated runtime changed its ORT version")
          if "CUDAExecutionProvider" not in onnxruntime.get_available_providers():
              raise SystemExit("relocated runtime lost CUDAExecutionProvider")
          print("relocated runtime smoke import: PASS")
          PY
          echo "P25_5_RUNTIME_ROOT=$RUNNER_TEMP/p25-5-runtime-extracted" >> "$GITHUB_ENV"
          echo "P25_5_RUNTIME_ARCHIVE=$runtime_archive" >> "$GITHUB_ENV"
          echo "P25_5_RUNTIME_SHA256=$runtime_sha" >> "$GITHUB_ENV"
          echo "P25_5_RUNTIME_SHA256_FILE=$P25_5_OUTPUT_DIR/whitewater-p25-5-runtime.tar.gz.sha256" >> "$GITHUB_ENV"
          echo "P25_5_RUNTIME_INVENTORY=$P25_5_OUTPUT_DIR/whitewater-p25-5-runtime.inventory" >> "$GITHUB_ENV"

      - name: Check glibc 2.28 baseline for runtime and evaluator ELFs
        run: |
          set -euo pipefail
          check_tree() {
            local tree="$1"
            [ -e "$tree" ] || return 0
            if [ -f "$tree" ]; then
              candidates=("$tree")
            else
              mapfile -d '' candidates < <(find "$tree" -type f -print0)
            fi
            for candidate in "${candidates[@]}"; do
              if file -b -- "$candidate" | grep -q 'ELF'; then
                scripts/check-glibc-baseline.sh "$candidate" 2.28
              fi
            done
          }
          check_tree "$P25_5_RUNTIME_ROOT"
          check_tree "$GITHUB_WORKSPACE/$P25_5_QUALIFIER"
          package_spec="$GITHUB_WORKSPACE/$P25_5_PACKAGE_SPEC"
          test -f "$package_spec" || {
            echo "P25-5 package specification is missing: $P25_5_PACKAGE_SPEC" >&2; exit 1; }
          while IFS= read -r evaluator_source; do
            [ -n "$evaluator_source" ] && check_tree "$evaluator_source"
          done < <(python3.11 - "$package_spec" <<'PY'
          import json
          import sys
          from pathlib import Path

          spec_path = Path(sys.argv[1]).resolve()
          document = json.loads(spec_path.read_text(encoding="utf-8"))
          for item in document.get("files", []):
              if item.get("role") == "evaluator":
                  source = Path(item["source"])
                  if not source.is_absolute():
                      source = spec_path.parent / source
                  print(source.resolve())
          PY
          )

      - name: Audit full conda environment closure without claiming target CUDA libraries
        run: |
          set -euo pipefail
          ort_capi=$(find "$P25_5_RUNTIME_ROOT" -type d -path '*/onnxruntime/capi' -print -quit)
          test -n "$ort_capi" || { echo "onnxruntime/capi payload not found" >&2; exit 1; }
          test -f "$ort_capi/libonnxruntime_providers_cuda.so" || {
            echo "onnxruntime-gpu CUDA provider payload is absent; refusing CUDA qualification" >&2
            exit 1; }
          set +e
          # Audit the whole relocated environment, not only ORT's capi directory. This catches
          # CUDA/cuDNN/cuBLAS wheels carried under site-packages/nvidia as well as the provider.
          scripts/report-ort-closure.sh "$P25_5_RUNTIME_ROOT" \
            > "$P25_5_OUTPUT_DIR/whitewater-p25-5-runtime-closure.txt" 2>&1
          closure_status=$?
          set -e
          cat "$P25_5_OUTPUT_DIR/whitewater-p25-5-runtime-closure.txt"
          if [ "$closure_status" -ne 0 ]; then
            echo "CUDA closure has unresolved host libraries; this lane will run CPU correctness only."
            echo "CUDA provider qualification remains open; no CUDA shipping claim is made."
          else
            echo "CUDA provider closure is fully resolved in the EL8 build image."
          fi
          echo "P25_5_RUNTIME_CLOSURE=$P25_5_OUTPUT_DIR/whitewater-p25-5-runtime-closure.txt" >> "$GITHUB_ENV"

      - name: Run P25-5 export, qualification and evaluation-only packaging
        run: scripts/ci-p25-5-qualify.sh

      - uses: actions/upload-artifact@v7
        with:
          name: whitewater-p25-5-el8-${{ github.sha }}
          path: p25-5-output
          if-no-files-found: error
