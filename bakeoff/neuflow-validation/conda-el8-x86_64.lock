# White Water NeuFlow v2 export/validation EL8 x86_64 conda REQUESTED environment spec.
#
# THIS IS A REQUESTED SPEC (match specs), NOT A FULLY-PINNED @EXPLICIT SOLVE.
# It is the authored input consumed by `conda create --override-channels -c conda-forge
# --file <this file>` on an EL8 x86_64 host.  CI MUST solve it on EL8 x86_64 and emit the
# fully-pinned reproducible lock as evidence (`conda list --explicit` ->
# whitewater-neuflow-validation-runtime.inventory).  Do NOT treat this file as a reproducible lock
# and do NOT hand-edit build/hash pins into it; a pinned @EXPLICIT lock is produced only by a real
# solve, which cannot run on the macOS/arm64 development host.
#
# runtime-inputs.json conda.explicit_lock_sha256 is the SHA256 of THIS checked-in requested spec
# and CI's preflight validates it against this file, so it must always track this file -- do NOT
# overwrite it with a solved digest.  When CI emits the pinned @EXPLICIT lock, record ITS SHA256
# (never hand-computed here) under the DISTINCT field conda.solved_lock_sha256 and re-run the
# qualifying dispatch.
#
# PURPOSE.  This environment runs models/export_neuflow_v2.py offline on the airgapped box: it
# strictly loads the pinned NeuFlow v2 mixed checkpoint into the weightless upstream NeuFlow module,
# re-exports the FIXED-shape (1x3x432x768) opset-17 ONNX graph, and re-qualifies it (identity +
# both signed translation directions + PyTorch-vs-ONNX parity) against the models/neuflow-v2.json
# validation.* thresholds.  NeuFlow is ALREADY validation-passed on macOS-arm64; this runtime
# produces the linux-x86_64 ONNX artifact and re-validates it on the box.  The export is
# device-independent, so this is a CPU-only stack: like bakeoff/waft-validation and unlike the
# P25-5/P25-6 measurement runtimes it does NOT add the ONNX Runtime CUDA-12 archive or the native
# ORT bridge.  The runtime advertises CPUExecutionProvider ONLY: it has no CUDA execution provider
# compiled in, and pointing LD_LIBRARY_PATH at host CUDA libraries cannot add one.  --provider
# CUDAExecutionProvider fails here with "requested ONNX Runtime provider is unavailable"
# (RUN-NEUFLOW-VALIDATION.txt says the same); CUDA qualification would need a separate CUDA-enabled
# onnxruntime build in its own env and is out of scope for this CPU-only pack.
#
# THE ML EXPORT STACK IS pip-INSTALLED AT CI BUILD, NOT conda-sourced.  This conda spec is a
# MINIMAL BASE only: it provides the pinned python interpreter plus the conda-pack/setuptools
# packaging leaf.  conda-forge cannot provide the pinned CPU builds this export needs (there is no
# satisfiable conda-forge onnxruntime ==1.16.3 for this stack, and the torch/torchvision CPU builds
# come from the PyTorch CPU wheel index the same way the SEA-RAFT candidate proved), so the WHOLE
# ML export stack -- torch, torchvision, numpy, onnx, onnxruntime -- is pip-installed into THIS env
# by CI AFTER the conda solve and BEFORE conda-pack and the runtime-license inventory, mirroring the
# PROVEN models/requirements-searaft-export.txt pattern (torch/torchvision from
# https://download.pytorch.org/whl/cpu, the rest from PyPI).  The pip versions are exactly
# models/requirements-neuflow-export.txt (torch==2.0.1, torchvision==0.15.2, numpy==1.24.4,
# onnx==1.14.1, onnxruntime==1.16.3), which in turn mirror the pinned upstream README (NeuFlow_v2 @
# 204b5e37: "python==3.8 ... pytorch==2.0.1 torchvision==0.15.2").  Those pip packages are packed
# into the runtime and reported by licenses.py as pip identities (e.g. pip://torch==2.0.1,
# pip://onnxruntime==1.16.3) for the licence-supplement population step.  This stack is INCOMPATIBLE
# with the WAFT/SEA-RAFT stack (python 3.11 / torch 2.2.0 / onnxruntime 1.29.0), which is exactly
# why NeuFlow needs its own pack.
#
# Python is pinned to 3.9 (not the README's 3.8) because 3.8 is EOL and no longer conda-forge-built,
# and 3.9 is the validated export interpreter recorded in models/neuflow-v2.json; see
# runtime-inputs.json and RUN-NEUFLOW-VALIDATION.txt for that python38_torch201_risk note -- the
# py39 torch 2.0.1 CPU stack (pip-installed) is proven by CI's EL8 build and weightless smoke.

# Python 3.9 matches the NeuFlow v2 export environment ALREADY RECORDED in models/neuflow-v2.json
# (export_environment.python == "3.9.6", framework pytorch==2.0.1, onnx==1.14.1, onnxruntime==1.16.3),
# i.e. the exact interpreter the macOS-arm64 validation pass was produced under.  The pinned upstream
# README documents python==3.8, but 3.8 reached upstream end-of-life (2024-10) and conda-forge has
# stopped building new packages for it, so an EL8 solve of a py38 base is unsatisfiable on
# conda-forge and fails closed; 3.9 is both conda-forge-built and the model's own validated export
# interpreter, so it re-exports on the framework the frozen validation.* thresholds were produced on.
# The torch 2.0.1 / numpy 1.24.4 / onnx 1.14.1 / onnxruntime 1.16.3 pip wheels are all available for
# py39 linux-64; CI's EL8 build proves they install and co-import.
python 3.9.*

# conda-pack is pinned to 0.8.1 (matching the P25-5/P25-6/WAFT locks): conda-forge's conda-pack
# 0.9.2 installs dist-info with `Version: 0.0.0` and no License field, so licenses.py cannot derive
# its licence and fails closed.  0.8.1 carries usable metadata and needs no supplement.  conda-pack
# is a pure-python leaf tool (shipped only so the airgap wrapper can run conda-unpack), so pinning
# it does not perturb the rest of the solve.
conda-pack ==0.8.1

# setuptools is held <81 because conda-pack 0.8.1 imports `pkg_resources`, which setuptools removed
# from its bundle in v81+; without this the solve pulls setuptools 84 and conda-pack fails at
# import with ModuleNotFoundError: No module named 'pkg_resources'.  setuptools carries its own
# embedded MIT licence, so no supplement is needed.
setuptools <81
