# White Water WAFT export/validation EL8 x86_64 conda REQUESTED environment spec.
#
# THIS IS THE REQUESTED SPEC (match specs), NOT A FULLY-PINNED @EXPLICIT SOLVE.  It is the FIRST of
# a TWO-DIGEST pair (see bakeoff/waft-validation/runtime-inputs.json conda.note):
#   * REQUESTED SPEC (this file)  -> conda.requested_spec / conda.requested_spec_sha256
#   * SOLVED @EXPLICIT LOCK        -> conda.solved_lock / conda.solved_lock_sha256
#                                    (committed as conda-el8-x86_64.solved.lock after review)
# It is the authored input consumed by `conda create --override-channels -c conda-forge
# --file <this file>` on an EL8 x86_64 host.  CI MUST solve it on EL8 x86_64 and emit the
# fully-pinned reproducible lock as evidence (`conda list --explicit` ->
# whitewater-waft-validation-runtime.inventory).  Do NOT treat this file as a reproducible lock
# and do NOT hand-edit build/hash pins into it; a pinned @EXPLICIT lock is produced only by a real
# solve, which cannot run on the macOS/arm64 development host.
#
# When CI regenerates the pinned lock, commit the emitted @EXPLICIT lock as
# bakeoff/waft-validation/conda-el8-x86_64.solved.lock and record its SHA256 (never hand-computed
# here) in runtime-inputs.json conda.solved_lock_sha256 -- a SEPARATE field from
# conda.requested_spec_sha256, which pins THIS file.  The qualifying dispatch then installs the
# committed @EXPLICIT lock verbatim rather than re-solving this spec.
#
# PURPOSE.  This environment runs models/export_waft.py offline on the airgapped box: it strictly
# loads the pinned WAFT/Twins checkpoint into a weightless twins_svt_large backbone, exports an
# opset-17 ONNX graph, and qualifies it (identity + both signed translation directions +
# PyTorch-vs-ONNX parity) against the models/waft-twins-artifact.json validation.* thresholds.
# The export is device-independent, so this is a CPU-only stack: unlike the P25-5/P25-6
# measurement runtimes it does NOT add the ONNX Runtime CUDA-12 archive or the native ORT bridge.
#
# THE ML EXPORT STACK IS pip-INSTALLED AT CI BUILD, NOT conda-sourced.  This conda spec is a
# MINIMAL BASE only: it provides the pinned python interpreter plus the conda-pack/setuptools
# packaging leaf.  conda-forge cannot provide the pinned CPU builds this export needs (there is no
# satisfiable conda-forge onnxruntime ==1.29.0, and the torch/torchvision CPU builds the SEA-RAFT
# candidate proved come from the PyTorch CPU wheel index), so the WHOLE ML export stack -- torch,
# torchvision, numpy, scipy, onnx, onnxruntime, safetensors, timm, einops -- is pip-installed into
# THIS env by CI AFTER the conda solve and BEFORE conda-pack and the runtime-license inventory,
# mirroring the PROVEN models/requirements-searaft-export.txt pattern (torch/torchvision from
# https://download.pytorch.org/whl/cpu, the rest from PyPI).  Those pip packages are packed into
# the runtime and reported by licenses.py as pip identities (e.g. pip://torch==2.2.0,
# pip://onnxruntime==1.29.0) for the licence-supplement population step.  See runtime-inputs.json
# export_dependencies for the exact versions/indexes and RUN-WAFT-VALIDATION.txt for the timm and
# torch-version RISK notes -- upstream WAFT documents a NEWER stack than this.

python 3.11.*

# conda-pack is pinned to 0.8.1 (matching the P25-5/P25-6 lock): conda-forge's conda-pack 0.9.2
# installs dist-info with `Version: 0.0.0` and no License field, so licenses.py cannot derive its
# licence and fails closed.  0.8.1 carries usable metadata and needs no supplement.  conda-pack is
# a pure-python leaf tool (shipped only so the airgap wrapper can run conda-unpack), so pinning it
# does not perturb the rest of the solve.
conda-pack ==0.8.1

# setuptools is held <81 because conda-pack 0.8.1 imports `pkg_resources`, which setuptools removed
# from its bundle in v81+; without this the solve pulls setuptools 84 and conda-pack fails at
# import with ModuleNotFoundError: No module named 'pkg_resources'.  setuptools carries its own
# embedded MIT licence, so no supplement is needed.
setuptools <81
