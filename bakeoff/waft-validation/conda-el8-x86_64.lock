# White Water WAFT export/validation EL8 x86_64 conda REQUESTED environment spec.
#
# THIS IS A REQUESTED SPEC (match specs), NOT A FULLY-PINNED @EXPLICIT SOLVE.
# It is the authored input consumed by `conda create --override-channels -c conda-forge
# --file <this file>` on an EL8 x86_64 host.  CI MUST solve it on EL8 x86_64 and emit the
# fully-pinned reproducible lock as evidence (`conda list --explicit` ->
# whitewater-waft-validation-runtime.inventory).  Do NOT treat this file as a reproducible lock
# and do NOT hand-edit build/hash pins into it; a pinned @EXPLICIT lock is produced only by a real
# solve, which cannot run on the macOS/arm64 development host.
#
# When CI regenerates the pinned lock, update
# bakeoff/waft-validation/runtime-inputs.json conda.explicit_lock_sha256 to the CI-solved lock's
# SHA256 (never hand-computed here) and re-run the qualifying dispatch.
#
# PURPOSE.  This environment runs models/export_waft.py offline on the airgapped box: it strictly
# loads the pinned WAFT/Twins checkpoint into a weightless twins_svt_large backbone, exports an
# opset-17 ONNX graph, and qualifies it (identity + both signed translation directions +
# PyTorch-vs-ONNX parity) against the models/waft-twins-artifact.json validation.* thresholds.
# The export is device-independent, so this is a CPU-only stack: unlike the P25-5/P25-6
# measurement runtimes it does NOT add the ONNX Runtime CUDA-12 archive or the native ORT bridge.
# onnxruntime is taken directly from conda-forge (CPU build), and there is no CUDA math-library
# dependency.
#
# WHY THESE PINS.  The export dependency versions mirror models/requirements-searaft-export.txt
# (torch==2.2.0, torchvision==0.17.0, numpy==1.26.4, scipy==1.12.0, onnx==1.15.0,
# onnxruntime==1.29.0, safetensors==0.4.2) so WAFT is exported and validated on the same numeric
# stack the SEA-RAFT candidate already used, and the frozen validation thresholds are read against
# a known framework rather than a moving one.  See runtime-inputs.json and RUN-WAFT-VALIDATION.txt
# for the timm and torch-version RISK notes -- upstream WAFT documents a NEWER stack than this.

python 3.11.*

# CPU-only PyTorch/torchvision.  conda-forge encodes the CPU vs CUDA choice in the BUILD STRING
# (there is no `cpuonly` package on conda-forge), so the build glob `=cpu*` requests the CPU
# variant and keeps the CUDA runtime, cuDNN and cuBLAS out of the pack.  The export never touches
# a GPU (torch.onnx.export and the parity check run on CPU), so a CPU build is correct and much
# smaller.  CI's EL8 solve is authoritative: if conda-forge's exact CPU build string for this
# torch differs, read the emitted @EXPLICIT lock (or the solver error) for the real build and, if
# ever needed, tighten this glob to it -- do not guess a build hash here.
pytorch ==2.2.0=cpu*
torchvision ==0.17.0=cpu*

numpy ==1.26.4
scipy ==1.12.0
onnx ==1.15.0
# onnxruntime here is the conda-forge CPU build (CPUExecutionProvider only); the CUDA provider is
# irrelevant to a device-independent export/validation run.  1.29.0 matches the SEA-RAFT export's
# pin.  If conda-forge lacks exactly 1.29.0 for this Python, CI's solve fails closed and names what
# it does have -- decide the nearest acceptable ORT then, in review, rather than silently drifting.
onnxruntime ==1.29.0
safetensors ==0.4.2

# timm builds WAFT's twins_svt_large feature encoder (weightless: export_waft.py forces
# pretrained=False and blocks any torch.hub download; the learned backbone tensors come only from
# the checkpoint).  timm is the SINGLE BIGGEST VERSION RISK: a timm whose twins_svt_large parameter
# names/shapes differ from the checkpoint fails export_waft.py's strict=True state-dict load
# (technical blocker strict_checkpoint_load_failure) before any ONNX is written.
#
# The pinned WAFT commit b152ff1cad1af8c185ee7b141997c48ff3334c87 does NOT pin timm: its
# requirements.txt lists a bare `timm` (torch/torchvision are bare there too), and its README
# documents a much newer dev stack (pytorch 2.7.0, CUDA 12.8, python 3.12) with no timm version.
# So the exact timm the checkpoint was produced with cannot be read off the pinned source.  This
# pin is therefore CONSERVATIVE, chosen contemporaneously with torch 2.2.0 (early 2024), and its
# correctness is proven only by CI's weightless twins_svt_large construction smoke plus the
# on-box strict checkpoint load.  If either fails, re-pin timm (see RUN-WAFT-VALIDATION.txt) and
# re-solve; treat this line as the most likely thing to change.
timm ==0.9.16

# einops is required by WAFT's model code (it is in the pinned commit's requirements.txt) and is
# imported by the backbone/model construction that export_waft.py exercises.  It is pure-python and
# permissive (MIT), so it is added proactively rather than discovered by a wasted airgap trip; the
# CI weightless WAFTv2(twins) construction smoke is the gate that would name any OTHER missing
# transitive import.  Left effectively unpinned (as WAFT itself leaves it) so CI's solve pins it.
einops

# conda-pack is pinned to 0.8.1 (matching the P25-5/P25-6 lock): conda-forge's conda-pack 0.9.2
# installs dist-info with `Version: 0.0.0` and no License field, so licenses.py cannot derive its
# licence and fails closed.  0.8.1 carries usable metadata and needs no supplement.  conda-pack is
# a pure-python leaf tool (shipped only so the airgap wrapper can run conda-unpack), so pinning it
# does not perturb the rest of the solve.
conda-pack ==0.8.1

# setuptools is held <81 because conda-pack 0.8.1 imports `pkg_resources`, which setuptools removed
# from its bundle in v81+; without this the solve pulls setuptools 84 and conda-pack fails at
# import with ModuleNotFoundError: No module named 'pkg_resources'.  setuptools carries its own
# embedded MIT licence, so no supplement is needed.
setuptools <81
